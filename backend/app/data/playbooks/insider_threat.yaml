# Insider Threat Incident Response Playbook
# Enhanced with role-based workflows, dependencies, and evidence tracking
# Based on MITRE ATT&CK T1078 (Valid Accounts), T1213 (Data from Information Repositories)

incident_type: insider_threat

mitre_attack:
  tactics:
    - "Initial Access"
    - "Persistence"
    - "Collection"
    - "Exfiltration"
  techniques:
    - "T1078 - Valid Accounts"
    - "T1213 - Data from Information Repositories"
    - "T1005 - Data from Local System"
    - "T1567 - Exfiltration Over Web Service"

roles:
  incident_commander:
    name: "Incident Commander"
    description: "Leads response, coordinates with HR and legal"
    required: true

  insider_threat_analyst:
    name: "Insider Threat Analyst"
    description: "Behavioral analysis and evidence collection"
    required: true

  hr_representative:
    name: "HR Representative"
    description: "Employee records and disciplinary coordination"
    required: true

  legal_counsel:
    name: "Legal Counsel"
    description: "Legal holds and potential prosecution"
    required: true

  security_admin:
    name: "Security Administrator"
    description: "Access revocation and system controls"
    required: true

phases:
  intake:
    description: "Initial insider threat detection and assessment"
    primary_role: "incident_commander"
    handoff_to: "insider_threat_analyst"

    handoff_requirements:
      all_required_fields_complete: true
      sign_off_required: false
      checklist_completion_threshold: 100

    required_fields:
      - suspected_user
      - suspicious_behavior
      - threat_type
      - time_of_detection

    checklist:
      - id: "intake_001"
        step: "Confirm insider threat incident"
        description: "Verify this is an insider threat"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "text"
            name: "classification_reasoning"
            prompt: "Why classified as insider threat?"

      - id: "intake_002"
        step: "Identify suspected insider"
        description: "Document insider identity and role"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_001"]
        critical: true
        evidence_required:
          - type: "text"
            name: "suspected_user_identity"
            prompt: "Suspected insider username/email"
          - type: "text"
            name: "user_role"
            prompt: "User's job role and access level"
          - type: "text"
            name: "employee_status"
            prompt: "Current employee, contractor, or former employee"

      - id: "intake_003"
        step: "Categorize threat type"
        description: "Determine if malicious, negligent, or compromised"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: ["intake_002"]
        critical: true
        evidence_required:
          - type: "text"
            name: "threat_category"
            prompt: "Threat type (malicious, negligent, compromised account)"

      - id: "intake_004"
        step: "Alert legal and HR immediately"
        description: "Notify legal counsel and HR of insider threat"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_003"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "legal_hr_notified"
            prompt: "Legal and HR notified?"
          - type: "timestamp"
            name: "notification_time"
            prompt: "When notified?"

  investigation:
    description: "Determine insider actions, intent, and potential damage"
    primary_role: "insider_threat_analyst"
    supporting_roles: ["hr_representative", "security_admin"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 80

    sla:
      target_completion_hours: 48
      escalation_threshold_hours: 72
      notify_roles: ["incident_commander", "legal_counsel"]

    checklist:
      - id: "inv_001"
        step: "Review file access logs"
        description: "Check for bulk downloads or unusual access"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "boolean"
            name: "unusual_file_access"
            prompt: "Unusual file access detected?"
          - type: "text"
            name: "file_access_summary"
            prompt: "Summary of suspicious file access"

      - id: "inv_002"
        step: "Check DLP alerts"
        description: "Review data loss prevention alerts"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 30
        parallel_group: "data_analysis"
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "dlp_alerts_found"
            prompt: "DLP alerts found?"
          - type: "text"
            name: "dlp_alert_details"
            prompt: "DLP alert details"
            optional: true

      - id: "inv_003"
        step: "Review USB/removable media usage"
        description: "Check for data transfers to USB drives"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 30
        parallel_group: "data_analysis"
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "usb_usage_detected"
            prompt: "USB/removable media usage detected?"

      - id: "inv_004"
        step: "Analyze email for data exfiltration"
        description: "Check for emails to personal accounts"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 45
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "email_exfiltration"
            prompt: "Email exfiltration detected?"

      - id: "inv_005"
        step: "Review HR records"
        description: "Check disciplinary history, performance issues"
        assigned_to: "hr_representative"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "hr_background"
            prompt: "Relevant HR history (disciplinary, performance, resignation)"

      - id: "inv_006"
        step: "Analyze behavioral patterns"
        description: "Review access patterns, off-hours activity"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 45
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "behavioral_anomalies"
            prompt: "Description of behavioral anomalies"

      - id: "inv_007"
        step: "Assess data compromise scope"
        description: "Determine what data was accessed/exfiltrated"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: ["inv_001", "inv_004"]
        critical: true
        evidence_required:
          - type: "text"
            name: "compromised_data"
            prompt: "Description of data accessed/exfiltrated"
          - type: "boolean"
            name: "data_exfiltrated"
            prompt: "Was data exfiltrated?"

  containment:
    description: "Stop insider actions while preserving evidence"
    primary_role: "security_admin"
    supporting_roles: ["legal_counsel", "hr_representative"]
    handoff_to: "legal_counsel"

    handoff_requirements:
      sign_off_required: true
      all_critical_steps_complete: true

    sla:
      target_completion_hours: 2
      escalation_threshold_hours: 4
      notify_roles: ["incident_commander"]

    checklist:
      - id: "cont_001"
        step: "Place legal hold on all insider data"
        description: "Preserve evidence per legal requirements"
        assigned_to: "legal_counsel"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "boolean"
            name: "legal_hold_placed"
            prompt: "Legal hold placed?"
          - type: "timestamp"
            name: "legal_hold_time"
            prompt: "When was legal hold placed?"

      - id: "cont_002"
        step: "Disable user accounts (do NOT notify user)"
        description: "Revoke all system access immediately"
        assigned_to: "security_admin"
        estimated_time_minutes: 5
        parallel_group: "access_revocation"
        dependencies: ["cont_001"]
        conditions:
          triggers_when:
            threat_category: "malicious"
        critical: true
        evidence_required:
          - type: "boolean"
            name: "accounts_disabled"
            prompt: "All accounts disabled?"
          - type: "timestamp"
            name: "disable_time"
            prompt: "When disabled?"

      - id: "cont_003"
        step: "Revoke VPN and remote access"
        description: "Block remote access immediately"
        assigned_to: "security_admin"
        estimated_time_minutes: 5
        parallel_group: "access_revocation"
        dependencies: ["cont_001"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "remote_access_revoked"
            prompt: "Remote access revoked?"

      - id: "cont_004"
        step: "Disable physical access badges"
        description: "Revoke building access"
        assigned_to: "hr_representative"
        estimated_time_minutes: 5
        parallel_group: "access_revocation"
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "badge_disabled"
            prompt: "Physical access disabled?"

      - id: "cont_005"
        step: "Block user devices from network"
        description: "MAC address filtering for user's devices"
        assigned_to: "security_admin"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "devices_blocked"
            prompt: "Devices blocked from network?"

      - id: "cont_006"
        step: "Collect company devices"
        description: "Secure laptops, phones, USB drives"
        assigned_to: "hr_representative"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: ["cont_002"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "devices_collected"
            prompt: "Company devices collected?"
          - type: "text"
            name: "devices_list"
            prompt: "List of devices collected"

  remediation:
    description: "Recovery and legal proceedings"
    primary_role: "legal_counsel"
    supporting_roles: ["hr_representative", "security_admin"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 90

    checklist:
      - id: "rem_001"
        step: "Conduct forensic analysis of devices"
        description: "Forensic examination of collected devices"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 240
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "forensic_findings"
            prompt: "Summary of forensic findings"

      - id: "rem_002"
        step: "Coordinate with HR on employment action"
        description: "Termination or disciplinary procedures"
        assigned_to: "hr_representative"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "employment_action"
            prompt: "Employment action taken (termination, suspension, etc.)"

      - id: "rem_003"
        step: "Assess law enforcement notification"
        description: "Determine if criminal prosecution warranted"
        assigned_to: "legal_counsel"
        estimated_time_minutes: 90
        parallel_group: null
        dependencies: ["rem_001"]
        evidence_required:
          - type: "boolean"
            name: "law_enforcement_notified"
            prompt: "Law enforcement notified?"
          - type: "text"
            name: "law_enforcement_details"
            prompt: "Details of law enforcement involvement"
            optional: true

      - id: "rem_004"
        step: "Implement enhanced monitoring"
        description: "Deploy additional insider threat controls"
        assigned_to: "security_admin"
        estimated_time_minutes: 120
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "monitoring_enhancements"
            prompt: "Description of enhanced monitoring implemented"

  closure:
    description: "Final documentation and lessons learned"
    primary_role: "incident_commander"

    checklist:
      - id: "close_001"
        step: "Create comprehensive timeline"
        description: "Document complete insider threat timeline"
        assigned_to: "incident_commander"
        estimated_time_minutes: 90
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "incident_timeline"
            prompt: "Complete incident timeline"

      - id: "close_002"
        step: "Document all evidence collected"
        description: "Catalog all evidence for potential legal proceedings"
        assigned_to: "insider_threat_analyst"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "evidence_inventory"
            prompt: "Complete evidence inventory"

      - id: "close_003"
        step: "Conduct lessons learned"
        description: "Post-incident review with stakeholders"
        assigned_to: "incident_commander"
        estimated_time_minutes: 120
        parallel_group: null
        dependencies: ["close_001", "close_002"]
        evidence_required:
          - type: "text"
            name: "lessons_learned"
            prompt: "Key lessons learned and improvements"

risk_factors:
  critical_risk:
    - threat_category: "malicious"
    - data_exfiltrated: true
    - privileged_user: true
    - trade_secrets_accessed: true

  high_risk:
    - threat_category: "malicious"
    - sensitive_data_accessed: true
    - employee_status: "terminating"

  medium_risk:
    - threat_category: "negligent"
    - policy_violations: "yes"

escalation:
  immediate:
    criteria:
      - "Malicious insider with data exfiltration"
      - "Privileged user abuse"
      - "Trade secrets or IP theft"
      - "Active ongoing exfiltration"
    notify_roles:
      - "incident_commander"
      - "legal_counsel"
      - "hr_representative"
    additional_roles_required:
      - "ciso"
      - "ceo"

  standard:
    criteria:
      - "Policy violations with data access"
      - "Departing employee suspicious activity"
    notify_roles:
      - "incident_commander"
      - "hr_representative"
