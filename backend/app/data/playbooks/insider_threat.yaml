# Insider Threat Incident Response Playbook
# Based on MITRE ATT&CK T1078 (Valid Accounts), T1213 (Data from Information Repositories)

incident_type: insider_threat

mitre_attack:
  tactics:
    - "Initial Access"
    - "Persistence"
    - "Collection"
    - "Exfiltration"
  techniques:
    - "T1078 - Valid Accounts"
    - "T1213 - Data from Information Repositories"
    - "T1005 - Data from Local System"
    - "T1567 - Exfiltration Over Web Service"
    - "T1530 - Data from Cloud Storage Object"

phases:
  intake:
    description: "Initial insider threat detection and assessment"
    required_fields:
      - suspected_user
      - suspicious_behavior
      - threat_type
      - time_of_detection

    initial_questions:
      - "What suspicious behavior was observed?"
      - "Is the insider a current employee, contractor, or former employee?"
      - "What is the user's role and access level?"
      - "Has the user exhibited prior concerning behavior?"
      - "Was this detected by automated monitoring or reported?"
      - "Is the threat malicious, negligent, or compromised account?"
      - "Has the user announced resignation or shown signs of dissatisfaction?"

  investigation:
    description: "Determine insider actions, intent, and potential damage"

    conditions:
      data_access_investigation:
        investigation_steps:
          - "Review file server access logs for bulk downloads"
          - "Check for access to sensitive data outside normal duties"
          - "Review database query logs for unusual patterns"
          - "Analyze cloud storage access (SharePoint, OneDrive, Google Drive)"
          - "Check for screenshots or screen recording activity"
          - "Review printing logs for sensitive documents"
          - "Identify personal device usage (USB, external drives)"
          - "Check email for forwarding sensitive information"

      exfiltration_indicators:
        investigation_steps:
          - "Review DLP alerts for data transfers"
          - "Check personal email usage from corporate systems"
          - "Analyze cloud storage uploads (Dropbox, personal Google Drive)"
          - "Review USB device connection logs and file transfers"
          - "Check for use of encrypted containers or compression"
          - "Review web proxy logs for file upload sites"
          - "Analyze email attachments sent to personal accounts"
          - "Check for code repository cloning (if developer)"

      privilege_abuse:
        investigation_steps:
          - "Review admin actions and privilege escalations"
          - "Check for unauthorized access to systems/applications"
          - "Review account creation or modification activities"
          - "Analyze security policy changes or exceptions"
          - "Check for disabling of logging or security controls"
          - "Review backdoor account creation"
          - "Identify attempts to cover tracks or delete logs"

      behavioral_indicators:
        investigation_steps:
          - "Review badge swipe/physical access logs for off-hours access"
          - "Check for remote access during unusual times"
          - "Analyze patterns: working hours, location, access frequency"
          - "Review HR records: disciplinary actions, performance issues"
          - "Check for recent resignation announcement or job searching"
          - "Identify financial stressors or personal issues (if known)"
          - "Review security training completion and policy acknowledgments"

      collaboration_assessment:
        investigation_steps:
          - "Identify if insider is working with external parties"
          - "Check for communication with competitors"
          - "Review social media for connections to external entities"
          - "Analyze timing of activities vs. external events"
          - "Check for unusual meeting schedules or contacts"
          - "Review travel records for visits to competitor locations"

  containment:
    description: "Stop insider actions while preserving evidence"

    conditions:
      active_malicious_insider:
        triggers_when:
          threat_type: "malicious"
          activity_ongoing: "yes"
        containment_actions:
          - "Disable all user accounts immediately (do NOT notify user first)"
          - "Revoke VPN and remote access immediately"
          - "Disable physical access badges"
          - "Block user's devices from network (MAC address filtering)"
          - "Preserve all account data and logs (legal hold)"
          - "Monitor for attempts to access via personal devices"
          - "Notify legal and HR teams immediately"
          - "Consider law enforcement notification"

      employee_separation_risk:
        triggers_when:
          employee_status: "terminating"
        containment_actions:
          - "Coordinate access revocation with HR separation timing"
          - "Enable enhanced monitoring before separation date"
          - "Restrict access to sensitive systems/data"
          - "Review recent data access and transfers"
          - "Collect company devices on separation day"
          - "Conduct exit interview regarding data/access"
          - "Disable accounts immediately upon separation"

      negligent_insider:
        triggers_when:
          threat_type: "negligent"
        containment_actions:
          - "Restrict access to systems until training completed"
          - "Enable supervised access with manager oversight"
          - "Implement additional DLP controls for user"
          - "Require security refresher training"
          - "Document incident for performance review"

      compromised_account:
        triggers_when:
          threat_type: "compromised"
        containment_actions:
          - "Force password reset immediately"
          - "Revoke all active sessions"
          - "Reset MFA tokens"
          - "Review and remove suspicious email rules"
          - "Check for backdoor access or persistence mechanisms"
          - "Follow account compromise playbook procedures"

  remediation:
    description: "Recover from insider threat and strengthen controls"

    standard_steps:
      - "Conduct forensic analysis of insider's systems"
      - "Identify all data accessed, copied, or exfiltrated"
      - "Determine if intellectual property was stolen"
      - "Assess business impact and competitive damage"
      - "Review access controls and implement least privilege"
      - "Enhance DLP policies to prevent similar incidents"
      - "Implement user behavior analytics (UBA) if not present"
      - "Review and update privileged access management"
      - "Enable additional logging for high-risk roles"

    legal_and_hr_actions:
      - "Document all evidence following chain of custody"
      - "Coordinate with legal on potential prosecution"
      - "Determine if civil action is appropriate (NDA violation, etc.)"
      - "Coordinate termination with legal and HR if employee"
      - "Send cease and desist letter if appropriate"
      - "Notify law enforcement if criminal activity suspected"
      - "Consider trade secret litigation if IP stolen"
      - "Review non-compete and confidentiality agreements"

    organizational_remediation:
      - "Conduct lessons learned with security and HR teams"
      - "Review employee background check procedures"
      - "Enhance pre-employment screening if gaps identified"
      - "Improve employee monitoring and anomaly detection"
      - "Update security awareness training on insider threats"
      - "Review offboarding procedures and access revocation"
      - "Implement separation of duties for critical functions"
      - "Create insider threat program if not present"

    affected_party_notification:
      - "Notify customers if their data was compromised"
      - "Inform business partners if shared data affected"
      - "Consider regulatory notification if data breach threshold met"
      - "Notify affected departments of intellectual property loss"

  closure:
    description: "Final documentation and program improvements"

    required_documentation:
      - "Insider identity, role, and access level"
      - "Timeline of suspicious activities"
      - "Data and systems accessed or compromised"
      - "Evidence of intent (malicious vs. negligent)"
      - "Containment actions and timing"
      - "Forensic findings and data exfiltration confirmation"
      - "Legal actions taken or recommended"
      - "HR actions (termination, disciplinary action)"

    program_improvements:
      - "Update insider threat detection rules"
      - "Enhance monitoring for similar behavior patterns"
      - "Review access controls for affected data/systems"
      - "Improve employee lifecycle security processes"
      - "Consider implementing insider threat program maturity model"

# Risk Assessment Criteria
risk_factors:
  critical_risk:
    - access_level: "admin"
    - data_exfiltrated: "yes"
    - intellectual_property_stolen: "yes"
    - working_with_competitor: "yes"
    - threat_type: "malicious"

  high_risk:
    - access_level: "privileged"
    - sensitive_data_accessed: "yes"
    - bulk_downloads: "yes"
    - employee_status: "terminating"
    - prior_incidents: "yes"

  medium_risk:
    - threat_type: "negligent"
    - policy_violations: "yes"
    - unusual_access_patterns: "yes"
    - data_accessed_outside_role: "yes"

  low_risk:
    - threat_type: "negligent"
    - minor_policy_violation: "yes"
    - no_data_exfiltration: "yes"
    - first_time_incident: "yes"

# Escalation Criteria
escalation:
  immediate:
    - "Admin or privileged account involved"
    - "Intellectual property or trade secrets stolen"
    - "Data exfiltration confirmed"
    - "Evidence of working with competitor"
    - "Active sabotage or system damage"
    - "Law enforcement notification required"

  standard:
    - "Sensitive data accessed outside of role"
    - "Bulk data downloads detected"
    - "Employee with separation risk"
    - "Multiple policy violations"
    - "Personal device usage for data transfer"

  low_priority:
    - "Negligent policy violation only"
    - "No sensitive data involved"
    - "Single incident, correctable behavior"
    - "Security awareness gap identified"

# Insider Threat Types
threat_types:
  malicious:
    description: "Intentional harm or theft"
    indicators:
      - "Data exfiltration to personal accounts"
      - "Access to data outside job responsibilities"
      - "Attempts to cover tracks or delete logs"
      - "Communication with competitors"
      - "Financial motivation or grudge"
    response: "Immediate containment, legal action, termination"

  negligent:
    description: "Unintentional security violations"
    indicators:
      - "Sending sensitive data to personal email for convenience"
      - "Storing data on unapproved cloud services"
      - "Sharing credentials with colleagues"
      - "Falling for phishing attacks"
      - "Poor security hygiene"
    response: "Remedial training, policy reinforcement, monitoring"

  compromised:
    description: "Legitimate account used by attacker"
    indicators:
      - "Unusual login locations or times"
      - "Multiple failed authentication attempts followed by success"
      - "Actions inconsistent with user's normal behavior"
      - "Access from impossible travel locations"
      - "Concurrent sessions from different locations"
    response: "Account compromise playbook, credential reset, MFA"

# Insider Threat Indicators by Role
role_based_indicators:
  IT_administrator:
    high_risk_activities:
      - "Creating backdoor accounts"
      - "Disabling logging or monitoring"
      - "Unauthorized access to systems"
      - "Privilege escalation outside duties"
      - "Downloading sensitive data or code"

  developer:
    high_risk_activities:
      - "Cloning entire code repositories to personal accounts"
      - "Accessing production data without authorization"
      - "Introducing backdoors into code"
      - "Downloading proprietary algorithms or IP"
      - "Pushing code to external repositories"

  finance_employee:
    high_risk_activities:
      - "Accessing financial records outside normal duties"
      - "Unauthorized wire transfers or payment changes"
      - "Exporting financial reports to personal devices"
      - "Accessing executive compensation data"
      - "Downloading customer payment information"

  sales_employee:
    high_risk_activities:
      - "Mass downloading of customer lists"
      - "Accessing pricing strategies before departure"
      - "Downloading sales forecasts or pipeline data"
      - "Forwarding customer contacts to personal email"
      - "Meeting with competitors during employment"

# Detection Methods
detection_mechanisms:
  automated:
    - "User and Entity Behavior Analytics (UEBA)"
    - "Data Loss Prevention (DLP) alerts"
    - "Privileged Access Management (PAM) alerts"
    - "File integrity monitoring"
    - "Database activity monitoring"
    - "Network traffic analysis"
    - "Endpoint detection and response (EDR)"

  manual:
    - "Manager reporting unusual behavior"
    - "Peer reporting concerns"
    - "Security team proactive hunting"
    - "HR referral for at-risk employees"
    - "Third-party tip (competitor, customer)"

# Prevention Best Practices
prevention:
  technical_controls:
    - "Implement least privilege access"
    - "Deploy DLP with content inspection"
    - "Enable user behavior analytics (UBA/UEBA)"
    - "Implement privileged access management (PAM)"
    - "Use file activity monitoring and alerting"
    - "Deploy endpoint DLP on workstations"
    - "Restrict USB and removable media usage"
    - "Monitor cloud storage and email forwarding"

  process_controls:
    - "Conduct background checks during hiring"
    - "Require signed NDAs and acceptable use policies"
    - "Implement separation of duties for critical functions"
    - "Establish formal offboarding procedures"
    - "Conduct exit interviews regarding data/access"
    - "Review access quarterly for appropriateness"
    - "Create insider threat working group (Security, HR, Legal)"

  cultural_controls:
    - "Foster positive work environment"
    - "Provide clear paths for grievance reporting"
    - "Recognize and reward employees"
    - "Address performance issues promptly"
    - "Maintain open communication channels"
    - "Train managers on insider threat indicators"
