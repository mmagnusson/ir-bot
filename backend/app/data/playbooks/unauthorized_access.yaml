# Unauthorized Access Incident Response Playbook
# Enhanced with role-based workflows, dependencies, and evidence tracking
# Based on MITRE ATT&CK T1078 (Valid Accounts), T1068 (Privilege Escalation)

incident_type: unauthorized_access

mitre_attack:
  tactics:
    - "Initial Access"
    - "Privilege Escalation"
    - "Persistence"
  techniques:
    - "T1078 - Valid Accounts"
    - "T1068 - Exploitation for Privilege Escalation"
    - "T1210 - Exploitation of Remote Services"
    - "T1133 - External Remote Services"

roles:
  incident_commander:
    name: "Incident Commander"
    description: "Leads response and coordinates team"
    required: true

  security_analyst:
    name: "Security Analyst"
    description: "Investigates unauthorized access and attack vectors"
    required: true

  system_admin:
    name: "System Administrator"
    description: "System lockdown and access control"
    required: true

  forensics_analyst:
    name: "Forensics Analyst"
    description: "Evidence collection and analysis"
    required: false
    escalation_triggers: ["privilege_escalation", "data_accessed"]

phases:
  intake:
    description: "Initial unauthorized access detection"
    primary_role: "incident_commander"
    handoff_to: "security_analyst"

    handoff_requirements:
      all_required_fields_complete: true
      sign_off_required: false
      checklist_completion_threshold: 100

    required_fields:
      - affected_system
      - time_of_detection
      - access_method

    checklist:
      - id: "intake_001"
        step: "Confirm unauthorized access"
        description: "Verify this is unauthorized access"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "text"
            name: "classification_reasoning"
            prompt: "Why classified as unauthorized access?"

      - id: "intake_002"
        step: "Identify affected system"
        description: "Document what system was accessed"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_001"]
        critical: true
        evidence_required:
          - type: "text"
            name: "affected_systems"
            prompt: "List of affected systems"

      - id: "intake_003"
        step: "Determine if access is ongoing"
        description: "Check if unauthorized access is currently active"
        assigned_to: "security_analyst"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_002"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "access_ongoing"
            prompt: "Is unauthorized access currently ongoing?"

  investigation:
    description: "Determine scope and impact of unauthorized access"
    primary_role: "security_analyst"
    supporting_roles: ["forensics_analyst", "system_admin"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 80

    sla:
      target_completion_hours: 4
      escalation_threshold_hours: 6
      notify_roles: ["incident_commander"]

    checklist:
      - id: "inv_001"
        step: "Review authentication logs"
        description: "Analyze login records for affected system"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "file"
            name: "auth_logs"
            prompt: "Upload authentication logs"
          - type: "text"
            name: "suspicious_logins"
            prompt: "Summary of suspicious login activity"

      - id: "inv_002"
        step: "Identify source IP and location"
        description: "Determine origin of unauthorized access"
        assigned_to: "security_analyst"
        estimated_time_minutes: 15
        parallel_group: null
        dependencies: ["inv_001"]
        evidence_required:
          - type: "text"
            name: "source_ip"
            prompt: "Source IP address"
          - type: "text"
            name: "geolocation"
            prompt: "Geographic location of source"

      - id: "inv_003"
        step: "Determine access method"
        description: "Identify how access was gained (credentials, exploit, etc.)"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: ["inv_001"]
        critical: true
        evidence_required:
          - type: "text"
            name: "access_method"
            prompt: "Access method (stolen credentials, vulnerability exploit, etc.)"

      - id: "inv_004"
        step: "Check for privilege escalation"
        description: "Determine if attacker escalated privileges"
        assigned_to: "security_analyst"
        estimated_time_minutes: 25
        parallel_group: "impact_assessment"
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "privilege_escalation"
            prompt: "Was privilege escalation detected?"
          - type: "text"
            name: "escalation_details"
            prompt: "Details of privilege escalation"
            optional: true

      - id: "inv_005"
        step: "Review command/action history"
        description: "Analyze what actions attacker took"
        assigned_to: "forensics_analyst"
        estimated_time_minutes: 45
        parallel_group: "impact_assessment"
        dependencies: []
        critical: true
        evidence_required:
          - type: "text"
            name: "attacker_actions"
            prompt: "Summary of actions taken by attacker"

      - id: "inv_006"
        step: "Check for data access or exfiltration"
        description: "Determine if data was accessed or stolen"
        assigned_to: "forensics_analyst"
        estimated_time_minutes: 40
        parallel_group: null
        dependencies: ["inv_005"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "data_accessed"
            prompt: "Was sensitive data accessed?"
          - type: "boolean"
            name: "data_exfiltrated"
            prompt: "Was data exfiltrated?"
          - type: "text"
            name: "data_description"
            prompt: "Description of data accessed/exfiltrated"
            optional: true

      - id: "inv_007"
        step: "Check for persistence mechanisms"
        description: "Look for backdoors or persistence methods"
        assigned_to: "forensics_analyst"
        estimated_time_minutes: 35
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "persistence_found"
            prompt: "Were persistence mechanisms found?"
          - type: "text"
            name: "persistence_details"
            prompt: "Details of persistence mechanisms"
            optional: true

  containment:
    description: "Block unauthorized access and secure systems"
    primary_role: "system_admin"
    supporting_roles: ["security_analyst"]
    handoff_to: "system_admin"

    handoff_requirements:
      sign_off_required: true
      all_critical_steps_complete: true

    sla:
      target_completion_hours: 1
      escalation_threshold_hours: 2
      notify_roles: ["incident_commander"]

    checklist:
      - id: "cont_001"
        step: "Terminate active unauthorized sessions"
        description: "Kill active sessions immediately"
        assigned_to: "system_admin"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: []
        conditions:
          triggers_when:
            access_ongoing: true
        critical: true
        evidence_required:
          - type: "boolean"
            name: "sessions_terminated"
            prompt: "Active sessions terminated?"
          - type: "timestamp"
            name: "termination_time"
            prompt: "When were sessions terminated?"

      - id: "cont_002"
        step: "Change compromised credentials"
        description: "Reset passwords for affected accounts"
        assigned_to: "system_admin"
        estimated_time_minutes: 10
        parallel_group: "credential_security"
        dependencies: []
        conditions:
          triggers_when:
            access_method: "stolen_credentials"
        critical: true
        evidence_required:
          - type: "boolean"
            name: "credentials_changed"
            prompt: "Compromised credentials changed?"

      - id: "cont_003"
        step: "Revoke API keys and tokens"
        description: "Invalidate compromised API access"
        assigned_to: "system_admin"
        estimated_time_minutes: 10
        parallel_group: "credential_security"
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "api_keys_revoked"
            prompt: "API keys/tokens revoked?"

      - id: "cont_004"
        step: "Block source IP addresses"
        description: "Firewall block attacking IPs"
        assigned_to: "system_admin"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "blocked_ips"
            prompt: "List of blocked IP addresses"

      - id: "cont_005"
        step: "Patch exploited vulnerability"
        description: "Apply security patches for exploited weakness"
        assigned_to: "system_admin"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        conditions:
          triggers_when:
            access_method: "vulnerability_exploit"
        critical: true
        evidence_required:
          - type: "text"
            name: "vulnerability_patched"
            prompt: "Vulnerability patched (CVE or description)"

      - id: "cont_006"
        step: "Remove persistence mechanisms"
        description: "Delete backdoors and persistence methods"
        assigned_to: "system_admin"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        conditions:
          triggers_when:
            persistence_found: true
        critical: true
        evidence_required:
          - type: "boolean"
            name: "persistence_removed"
            prompt: "Persistence mechanisms removed?"

      - id: "cont_007"
        step: "Enable enhanced monitoring"
        description: "Increase logging and alerting"
        assigned_to: "system_admin"
        estimated_time_minutes: 20
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "monitoring_enhancements"
            prompt: "Description of enhanced monitoring"

  remediation:
    description: "Restore security and prevent recurrence"
    primary_role: "system_admin"
    supporting_roles: ["security_analyst"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 90

    checklist:
      - id: "rem_001"
        step: "Verify unauthorized access stopped"
        description: "Confirm no further unauthorized activity"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "boolean"
            name: "access_stopped"
            prompt: "Unauthorized access stopped?"

      - id: "rem_002"
        step: "Implement additional access controls"
        description: "Strengthen authentication and authorization"
        assigned_to: "system_admin"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "access_control_improvements"
            prompt: "Access control improvements made"

      - id: "rem_003"
        step: "Conduct security audit"
        description: "Review system for other vulnerabilities"
        assigned_to: "security_analyst"
        estimated_time_minutes: 90
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "audit_findings"
            prompt: "Security audit findings"

      - id: "rem_004"
        step: "Update detection rules"
        description: "Enhance monitoring to detect similar attacks"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "detection_updates"
            prompt: "Detection rule updates made"

  closure:
    description: "Final documentation and lessons learned"
    primary_role: "incident_commander"

    checklist:
      - id: "close_001"
        step: "Create incident timeline"
        description: "Document complete timeline"
        assigned_to: "incident_commander"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "incident_timeline"
            prompt: "Complete incident timeline"

      - id: "close_002"
        step: "Document attack vector and TTPs"
        description: "Record how attack occurred"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "attack_vector_ttps"
            prompt: "Attack vector and TTPs documentation"

      - id: "close_003"
        step: "Recommend security improvements"
        description: "Suggest preventive measures"
        assigned_to: "security_analyst"
        estimated_time_minutes: 45
        parallel_group: null
        dependencies: ["close_002"]
        evidence_required:
          - type: "text"
            name: "security_recommendations"
            prompt: "Recommended security improvements"

      - id: "close_004"
        step: "Conduct lessons learned session"
        description: "Team debrief and process improvements"
        assigned_to: "incident_commander"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: ["close_003"]
        evidence_required:
          - type: "text"
            name: "lessons_learned"
            prompt: "Key lessons learned"

risk_factors:
  critical_risk:
    - privilege_escalation: true
    - data_exfiltrated: true
    - persistence_found: true
    - admin_account_compromised: true

  high_risk:
    - data_accessed: true
    - access_method: "vulnerability_exploit"
    - multiple_systems_affected: true

  medium_risk:
    - access_method: "stolen_credentials"
    - limited_system_access: true

escalation:
  immediate:
    criteria:
      - "Privileged account compromised"
      - "Data exfiltration confirmed"
      - "Persistence mechanisms found"
      - "Multiple critical systems affected"
    notify_roles:
      - "incident_commander"
      - "system_admin"
      - "security_analyst"
    additional_roles_required:
      - "ciso"

  standard:
    criteria:
      - "Standard user account compromised"
      - "Vulnerability exploitation detected"
      - "Single system affected"
    notify_roles:
      - "incident_commander"
      - "security_analyst"
