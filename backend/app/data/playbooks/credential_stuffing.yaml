# Credential Stuffing Attack Incident Response Playbook
# Handles automated login attempts using compromised credentials from breaches

incident_type: credential_stuffing

roles:
  incident_commander:
    name: "Incident Commander"
    description: "Leads response coordination"
    required: true

  security_analyst:
    name: "Security Analyst"
    description: "Analyzes attack patterns and implements controls"
    required: true

  identity_access_admin:
    name: "Identity & Access Administrator"
    description: "Manages account security and MFA"
    required: true

  threat_intelligence_analyst:
    name: "Threat Intelligence Analyst"
    description: "Researches credential sources and threat actors"
    required: false

phases:
  intake:
    description: "Initial credential stuffing assessment"
    primary_role: "incident_commander"
    handoff_to: "security_analyst"

    handoff_requirements:
      all_required_fields_complete: true
      checklist_completion_threshold: 100

    required_fields:
      - affected_service
      - attack_volume
      - time_of_detection

    checklist:
      - id: "intake_001"
        step: "Verify credential stuffing classification"
        description: "Confirm automated login attempts using leaked credentials"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        critical: true
        evidence_required:
          - type: "text"
            name: "classification_rationale"
            prompt: "Evidence of credential stuffing vs brute force"

      - id: "intake_002"
        step: "Quantify attack volume"
        description: "Determine number of login attempts and timeframe"
        assigned_to: "security_analyst"
        estimated_time_minutes: 15
        dependencies: ["intake_001"]
        critical: true
        evidence_required:
          - type: "number"
            name: "total_login_attempts"
            prompt: "Total number of login attempts"
          - type: "text"
            name: "attack_duration"
            prompt: "Attack duration"
          - type: "number"
            name: "unique_source_ips"
            prompt: "Number of unique source IPs"

      - id: "intake_003"
        step: "Check for successful logins"
        description: "Identify if any login attempts succeeded"
        assigned_to: "security_analyst"
        estimated_time_minutes: 20
        dependencies: ["intake_002"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "successful_logins_detected"
            prompt: "Were any logins successful?"
          - type: "number"
            name: "compromised_accounts_count"
            prompt: "Number of accounts successfully accessed"
            optional: true

  investigation:
    description: "Analyze attack source and impact"
    primary_role: "security_analyst"
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 85

    sla:
      target_completion_hours: 3
      escalation_threshold_hours: 4

    checklist:
      - id: "inv_001"
        step: "Analyze authentication logs"
        description: "Review logs for attack patterns and source IPs"
        assigned_to: "security_analyst"
        estimated_time_minutes: 45
        critical: true
        evidence_required:
          - type: "text"
            name: "attack_pattern"
            prompt: "Description of attack pattern"
          - type: "text"
            name: "source_ip_analysis"
            prompt: "Analysis of source IPs (botnets, VPNs, Tor, etc.)"

      - id: "inv_002"
        step: "Identify credential source"
        description: "Research which breach credentials are from"
        assigned_to: "threat_intelligence_analyst"
        estimated_time_minutes: 30
        evidence_required:
          - type: "text"
            name: "credential_source"
            prompt: "Suspected breach source (HaveIBeenPwned, etc.)"

      - id: "inv_003"
        step: "Assess MFA effectiveness"
        description: "Check if MFA prevented account compromise"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 20
        evidence_required:
          - type: "boolean"
            name: "mfa_prevented_access"
            prompt: "Did MFA prevent unauthorized access?"

      - id: "inv_004"
        step: "Identify compromised accounts"
        description: "List all accounts with successful unauthorized logins"
        assigned_to: "security_analyst"
        estimated_time_minutes: 40
        conditions:
          triggers_when:
            successful_logins: "yes"
        critical: true
        evidence_required:
          - type: "text"
            name: "compromised_accounts_list"
            prompt: "List of compromised accounts"

      - id: "inv_005"
        step: "Check for bot detection bypass"
        description: "Determine if CAPTCHA or bot detection was bypassed"
        assigned_to: "security_analyst"
        estimated_time_minutes: 25
        evidence_required:
          - type: "boolean"
            name: "bot_detection_bypassed"
            prompt: "Was bot detection bypassed?"

  containment:
    description: "Stop attack and secure compromised accounts"
    primary_role: "incident_commander"
    supporting_roles: ["security_analyst", "identity_access_admin"]
    handoff_to: "identity_access_admin"

    handoff_requirements:
      sign_off_required: true
      all_critical_steps_complete: true

    sla:
      target_completion_hours: 1
      escalation_threshold_hours: 2

    checklist:
      - id: "cont_001"
        step: "Block attack source IPs"
        description: "Add source IPs to firewall/WAF blocklist"
        assigned_to: "security_analyst"
        estimated_time_minutes: 15
        critical: true
        evidence_required:
          - type: "number"
            name: "ips_blocked"
            prompt: "Number of IPs blocked"

      - id: "cont_002"
        step: "Enable aggressive rate limiting"
        description: "Implement strict rate limits on login endpoints"
        assigned_to: "security_analyst"
        estimated_time_minutes: 20
        critical: true
        evidence_required:
          - type: "text"
            name: "rate_limit_configuration"
            prompt: "New rate limit settings"

      - id: "cont_003"
        step: "Force password reset on compromised accounts"
        description: "Immediately lock and reset passwords for affected accounts"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 30
        conditions:
          triggers_when:
            successful_logins: "yes"
        critical: true
        evidence_required:
          - type: "number"
            name: "accounts_reset"
            prompt: "Number of accounts reset"

      - id: "cont_004"
        step: "Terminate active sessions"
        description: "Revoke all sessions for compromised accounts"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 15
        conditions:
          triggers_when:
            successful_logins: "yes"
        critical: true
        evidence_required:
          - type: "boolean"
            name: "sessions_terminated"
            prompt: "All unauthorized sessions terminated?"

      - id: "cont_005"
        step: "Enable CAPTCHA on login page"
        description: "Deploy CAPTCHA to prevent automated attacks"
        assigned_to: "security_analyst"
        estimated_time_minutes: 25
        evidence_required:
          - type: "boolean"
            name: "captcha_enabled"
            prompt: "CAPTCHA enabled?"

  remediation:
    description: "Implement long-term protections"
    primary_role: "identity_access_admin"
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 85

    checklist:
      - id: "rem_001"
        step: "Enforce MFA organization-wide"
        description: "Require multi-factor authentication for all users"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 90
        critical: true
        evidence_required:
          - type: "text"
            name: "mfa_enforcement_policy"
            prompt: "MFA enforcement policy details"

      - id: "rem_002"
        step: "Implement breach password detection"
        description: "Deploy password breach detection service"
        assigned_to: "security_analyst"
        estimated_time_minutes: 60
        evidence_required:
          - type: "text"
            name: "breach_detection_service"
            prompt: "Password breach detection solution deployed"

      - id: "rem_003"
        step: "Deploy bot protection solution"
        description: "Implement advanced bot detection (reCAPTCHA Enterprise, etc.)"
        assigned_to: "security_analyst"
        estimated_time_minutes: 120
        evidence_required:
          - type: "text"
            name: "bot_protection_solution"
            prompt: "Bot protection solution implemented"

      - id: "rem_004"
        step: "Implement account lockout policies"
        description: "Configure progressive delays and lockouts"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 45
        evidence_required:
          - type: "text"
            name: "lockout_policy"
            prompt: "Account lockout policy configuration"

      - id: "rem_005"
        step: "Enable anomalous login detection"
        description: "Deploy behavioral analytics for login monitoring"
        assigned_to: "security_analyst"
        estimated_time_minutes: 90
        evidence_required:
          - type: "text"
            name: "anomaly_detection"
            prompt: "Anomalous login detection solution"

      - id: "rem_006"
        step: "Conduct password hygiene campaign"
        description: "Force password changes for weak/breached passwords"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 120
        evidence_required:
          - type: "boolean"
            name: "password_campaign_initiated"
            prompt: "Password hygiene campaign started?"

  closure:
    description: "Final documentation and improvements"
    primary_role: "incident_commander"

    checklist:
      - id: "close_001"
        step: "Document attack statistics"
        description: "Record attack volume, success rate, and impact"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        evidence_required:
          - type: "text"
            name: "attack_statistics"
            prompt: "Complete attack statistics"

      - id: "close_002"
        step: "Create incident timeline"
        description: "Document attack and response timeline"
        assigned_to: "incident_commander"
        estimated_time_minutes: 30
        evidence_required:
          - type: "text"
            name: "incident_timeline"
            prompt: "Complete timeline"

      - id: "close_003"
        step: "Update authentication security policies"
        description: "Strengthen authentication policies based on lessons learned"
        assigned_to: "identity_access_admin"
        estimated_time_minutes: 45
        evidence_required:
          - type: "text"
            name: "policy_updates"
            prompt: "Policy updates implemented"

risk_factors:
  critical_risk:
    - successful_logins: "yes"
    - accounts_compromised_count: ">100"
    - mfa_prevented_access: "no"

  high_risk:
    - successful_logins: "yes"
    - bot_detection_bypassed: "yes"

  medium_risk:
    - attack_volume: "high"
    - mfa_prevented_access: "yes"

  low_risk:
    - successful_logins: "no"

escalation:
  immediate:
    criteria:
      - "Successful compromise of privileged accounts"
      - "Over 100 accounts compromised"
      - "Ongoing attack not contained"
    notify_roles:
      - "incident_commander"
      - "identity_access_admin"
    additional_roles_required:
      - "ciso"

  standard:
    criteria:
      - "Limited account compromise detected"
      - "MFA prevented most access"
    notify_roles:
      - "incident_commander"
      - "security_analyst"
