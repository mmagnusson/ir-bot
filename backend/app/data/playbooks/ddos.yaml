# DDoS Attack Incident Response Playbook
# Enhanced with role-based workflows, dependencies, and evidence tracking
# Based on MITRE ATT&CK T1498 (Network Denial of Service) and T1499 (Endpoint Denial of Service)

incident_type: ddos

mitre_attack:
  tactics:
    - "Impact"
  techniques:
    - "T1498 - Network Denial of Service"
    - "T1499 - Endpoint Denial of Service"
    - "T1498.001 - Direct Network Flood"
    - "T1498.002 - Reflection Amplification"

roles:
  incident_commander:
    name: "Incident Commander"
    description: "Leads response, coordinates with ISP and stakeholders"
    required: true

  network_engineer:
    name: "Network Engineer"
    description: "Network traffic analysis and mitigation"
    required: true

  isp_liaison:
    name: "ISP Liaison"
    description: "Coordinates with Internet Service Provider"
    required: true

  security_analyst:
    name: "Security Analyst"
    description: "Attack analysis and threat intelligence"
    required: true

  communications_lead:
    name: "Communications Lead"
    description: "Customer and stakeholder communication"
    required: false
    escalation_triggers: ["service_outage", "customer_impact"]

phases:
  intake:
    description: "Initial DDoS detection and assessment"
    primary_role: "incident_commander"
    handoff_to: "network_engineer"

    handoff_requirements:
      all_required_fields_complete: true
      sign_off_required: false
      checklist_completion_threshold: 100

    sla:
      target_completion_hours: 0.25
      escalation_threshold_hours: 0.5
      notify_roles: ["incident_commander", "network_engineer"]

    required_fields:
      - affected_service
      - attack_type

    checklist:
      - id: "intake_001"
        step: "Confirm DDoS attack"
        description: "Verify this is a DDoS attack"
        assigned_to: "incident_commander"
        estimated_time_minutes: 3
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "text"
            name: "classification_reasoning"
            prompt: "Why classified as DDoS?"

      - id: "intake_002"
        step: "Identify affected services"
        description: "Determine what services/systems are impacted"
        assigned_to: "network_engineer"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_001"]
        critical: true
        evidence_required:
          - type: "text"
            name: "affected_services"
            prompt: "List of affected services/systems"

      - id: "intake_003"
        step: "Assess service impact"
        description: "Determine if services are degraded or offline"
        assigned_to: "incident_commander"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_002"]
        critical: true
        evidence_required:
          - type: "text"
            name: "impact_assessment"
            prompt: "Impact level (degraded, partial outage, full outage)"

      - id: "intake_004"
        step: "Alert ISP immediately"
        description: "Contact ISP for upstream mitigation"
        assigned_to: "isp_liaison"
        estimated_time_minutes: 5
        parallel_group: null
        dependencies: ["intake_003"]
        critical: true
        evidence_required:
          - type: "boolean"
            name: "isp_notified"
            prompt: "ISP notified?"
          - type: "timestamp"
            name: "isp_notification_time"
            prompt: "When was ISP notified?"

  investigation:
    description: "Analyze attack characteristics and source"
    primary_role: "network_engineer"
    supporting_roles: ["security_analyst"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: false
      checklist_completion_threshold: 70

    sla:
      target_completion_hours: 1
      escalation_threshold_hours: 2
      notify_roles: ["incident_commander"]

    checklist:
      - id: "inv_001"
        step: "Analyze network traffic patterns"
        description: "Review NetFlow/sFlow data for attack patterns"
        assigned_to: "network_engineer"
        estimated_time_minutes: 15
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "text"
            name: "traffic_analysis"
            prompt: "Summary of traffic patterns observed"

      - id: "inv_002"
        step: "Identify attack type"
        description: "Determine DDoS attack type (volumetric, protocol, application)"
        assigned_to: "security_analyst"
        estimated_time_minutes: 15
        parallel_group: null
        dependencies: ["inv_001"]
        critical: true
        evidence_required:
          - type: "text"
            name: "attack_type"
            prompt: "Attack type (SYN flood, UDP flood, HTTP flood, DNS amplification, etc.)"

      - id: "inv_003"
        step: "Measure attack volume"
        description: "Quantify attack traffic volume"
        assigned_to: "network_engineer"
        estimated_time_minutes: 10
        parallel_group: "metrics"
        dependencies: ["inv_001"]
        evidence_required:
          - type: "number"
            name: "attack_volume_gbps"
            prompt: "Attack volume in Gbps"
          - type: "number"
            name: "packets_per_second"
            prompt: "Packets per second"
            optional: true

      - id: "inv_004"
        step: "Identify source IPs/regions"
        description: "Determine attack source locations"
        assigned_to: "network_engineer"
        estimated_time_minutes: 15
        parallel_group: "metrics"
        dependencies: ["inv_001"]
        evidence_required:
          - type: "text"
            name: "source_ips"
            prompt: "Top source IPs or IP ranges"
          - type: "text"
            name: "source_regions"
            prompt: "Geographic regions of attack sources"

      - id: "inv_005"
        step: "Check for application layer attacks"
        description: "Analyze for HTTP/HTTPS application attacks"
        assigned_to: "security_analyst"
        estimated_time_minutes: 20
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "application_layer_attack"
            prompt: "Is this an application layer attack?"

  containment:
    description: "Mitigate attack and restore services"
    primary_role: "network_engineer"
    supporting_roles: ["isp_liaison", "security_analyst"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: false
      all_critical_steps_complete: true

    sla:
      target_completion_hours: 1
      escalation_threshold_hours: 2
      notify_roles: ["incident_commander"]

    checklist:
      - id: "cont_001"
        step: "Enable ISP upstream filtering"
        description: "Request ISP to filter attack traffic"
        assigned_to: "isp_liaison"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "boolean"
            name: "isp_filtering_enabled"
            prompt: "ISP upstream filtering enabled?"

      - id: "cont_002"
        step: "Block source IPs at firewall"
        description: "Null route or block attacking IPs"
        assigned_to: "network_engineer"
        estimated_time_minutes: 10
        parallel_group: "local_mitigation"
        dependencies: []
        evidence_required:
          - type: "text"
            name: "blocked_ips"
            prompt: "List of blocked IP addresses/ranges"

      - id: "cont_003"
        step: "Enable rate limiting"
        description: "Implement connection/request rate limits"
        assigned_to: "network_engineer"
        estimated_time_minutes: 15
        parallel_group: "local_mitigation"
        dependencies: []
        evidence_required:
          - type: "text"
            name: "rate_limits"
            prompt: "Rate limiting configuration applied"

      - id: "cont_004"
        step: "Activate CDN DDoS protection"
        description: "Enable CDN-based DDoS mitigation (if available)"
        assigned_to: "network_engineer"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: []
        conditions:
          triggers_when:
            application_layer_attack: true
        evidence_required:
          - type: "boolean"
            name: "cdn_protection_enabled"
            prompt: "CDN DDoS protection enabled?"

      - id: "cont_005"
        step: "Implement GeoIP blocking"
        description: "Block traffic from attacking regions"
        assigned_to: "network_engineer"
        estimated_time_minutes: 10
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "blocked_regions"
            prompt: "Geographic regions blocked"

      - id: "cont_006"
        step: "Scale infrastructure if possible"
        description: "Add capacity to absorb attack traffic"
        assigned_to: "network_engineer"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "boolean"
            name: "infrastructure_scaled"
            prompt: "Infrastructure scaled up?"

  remediation:
    description: "Verify mitigation and enhance defenses"
    primary_role: "network_engineer"
    supporting_roles: ["security_analyst"]
    handoff_to: "incident_commander"

    handoff_requirements:
      sign_off_required: true
      checklist_completion_threshold: 90

    checklist:
      - id: "rem_001"
        step: "Verify service restoration"
        description: "Confirm services are back online and stable"
        assigned_to: "network_engineer"
        estimated_time_minutes: 15
        parallel_group: null
        dependencies: []
        critical: true
        evidence_required:
          - type: "boolean"
            name: "services_restored"
            prompt: "Services fully restored?"
          - type: "timestamp"
            name: "restoration_time"
            prompt: "When were services restored?"

      - id: "rem_002"
        step: "Monitor for attack resumption"
        description: "Watch for renewed attack attempts"
        assigned_to: "network_engineer"
        estimated_time_minutes: 60
        parallel_group: null
        dependencies: ["rem_001"]
        evidence_required:
          - type: "boolean"
            name: "attack_resumed"
            prompt: "Did attack resume?"

      - id: "rem_003"
        step: "Document attack TTPs"
        description: "Record attack tactics, techniques, procedures"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "attack_ttps"
            prompt: "Attack TTPs documentation"

      - id: "rem_004"
        step: "Update DDoS mitigation playbook"
        description: "Enhance procedures based on lessons learned"
        assigned_to: "security_analyst"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: ["rem_003"]
        evidence_required:
          - type: "text"
            name: "playbook_updates"
            prompt: "Playbook enhancements made"

  closure:
    description: "Final documentation and post-incident review"
    primary_role: "incident_commander"

    checklist:
      - id: "close_001"
        step: "Create attack timeline"
        description: "Document complete attack timeline"
        assigned_to: "incident_commander"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "attack_timeline"
            prompt: "Complete attack timeline"

      - id: "close_002"
        step: "Calculate total downtime"
        description: "Measure service impact duration"
        assigned_to: "incident_commander"
        estimated_time_minutes: 15
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "number"
            name: "downtime_minutes"
            prompt: "Total downtime in minutes"

      - id: "close_003"
        step: "Document mitigation effectiveness"
        description: "Record what worked and what didn't"
        assigned_to: "network_engineer"
        estimated_time_minutes: 30
        parallel_group: null
        dependencies: []
        evidence_required:
          - type: "text"
            name: "mitigation_effectiveness"
            prompt: "Mitigation effectiveness assessment"

      - id: "close_004"
        step: "Recommend infrastructure improvements"
        description: "Suggest DDoS protection enhancements"
        assigned_to: "network_engineer"
        estimated_time_minutes: 45
        parallel_group: null
        dependencies: ["close_003"]
        evidence_required:
          - type: "text"
            name: "infrastructure_recommendations"
            prompt: "Recommended infrastructure improvements"

risk_factors:
  critical_risk:
    - impact_assessment: "full_outage"
    - attack_volume_gbps: ">100"
    - service_affected: "critical_business_service"

  high_risk:
    - impact_assessment: "partial_outage"
    - attack_volume_gbps: ">50"
    - application_layer_attack: true

  medium_risk:
    - impact_assessment: "degraded"
    - attack_volume_gbps: ">10"

escalation:
  immediate:
    criteria:
      - "Critical business services offline"
      - "Attack volume exceeds mitigation capacity"
      - "Prolonged outage (>2 hours)"
    notify_roles:
      - "incident_commander"
      - "network_engineer"
      - "isp_liaison"
    additional_roles_required:
      - "ciso"
      - "cto"
      - "communications_lead"

  standard:
    criteria:
      - "Services degraded but operational"
      - "Attack persisting despite mitigation"
    notify_roles:
      - "incident_commander"
      - "network_engineer"
